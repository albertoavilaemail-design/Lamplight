<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Lamplight Bible Study</title>

<style>
/* Layout: one phone-width column, a lamp-lit "tonight" page first, bottom tab bar for the other rooms. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E9ECF2; --fg:#1B2130; --muted:#5B6376; --line:#D8DCE5;
  --accent:#8A5A12; --accent-ink:#FFFFFF; --accent-soft:#F4E8D1; --good:#2E7650; --good-soft:#DCEFE3; --warn:#9C4E1A; --warn-soft:#F6E3D5;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141C; --surface:#171D28; --surface-2:#212937; --fg:#E8EAF0; --muted:#9AA2B4; --line:#2B3445;
  --accent:#E4B45E; --accent-ink:#1A1408; --accent-soft:#33291A; --good:#72C493; --good-soft:#1C3127; --warn:#E59C66; --warn-soft:#3A2619; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#171D28; --surface-2:#212937; --fg:#E8EAF0; --muted:#9AA2B4; --line:#2B3445;
  --accent:#E4B45E; --accent-ink:#1A1408; --accent-soft:#33291A; --good:#72C493; --good-soft:#1C3127; --warn:#E59C66; --warn-soft:#3A2619; color-scheme:dark }
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 110px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.quiet{background:var(--surface-2);border-radius:var(--r);padding:14px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button:hover,.btn:hover{border-color:var(--muted)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary:hover{filter:brightness(1.05);border-color:var(--accent)}
.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.sm{min-height:32px;padding:5px 12px;font-size:.875rem}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-weight:600;font-size:.95rem;display:block}
input[type=text],input[type=number],input[type=time],input[type=search],textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
.field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}

/* Tonight hero */
.hero{padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.hero > *{position:relative}
.ref{font-family:var(--display);font-size:2.2rem;line-height:1.1;margin-block:6px 10px;text-wrap:balance}
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px}
.step > div{min-width:0}
.num{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.num.done{background:var(--accent);color:var(--accent-ink)}
.prompt{font-family:var(--display);font-size:1.15rem;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.85rem;cursor:pointer;min-height:32px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.banner{border-radius:12px;padding:12px 14px;font-size:.95rem}
.banner.warn{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.banner.good{background:var(--good-soft);border:1px solid var(--good)}
.banner.lamp{background:var(--accent-soft);border:1px solid var(--accent)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.lamp{background:var(--accent-soft);color:var(--accent)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.week i{display:block;height:26px;border-radius:7px;background:var(--surface-2);margin-bottom:3px}
.week i.on{background:var(--accent)}
.week i.today{outline:1.5px solid var(--accent);outline-offset:1px}

/* Lists */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item:first-child{border-top:0}
.plan-list{max-height:360px;overflow-y:auto}
.plan-row{display:grid;grid-template-columns:22px 54px 1fr auto;cursor:pointer;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:.92rem}
.plan-row:first-child{border-top:0}
.plan-row .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;font-weight:600}
.plan-row.current{background:var(--accent-soft)}
.plan-row input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.plan-row:has(input:checked) .t{color:var(--muted)}
.plan-row.flash{outline:2px solid var(--accent);outline-offset:-2px}
.plan-row .t{min-width:0}
.entry-q{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:4px}
.entry-a{white-space:pre-wrap;overflow-wrap:anywhere}
.verse-text{font-family:var(--display);font-size:1.25rem;line-height:1.45}
.hidden-text{color:transparent;text-shadow:0 0 9px var(--muted);user-select:none}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;border-radius:0;background:transparent;flex-direction:column;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);min-height:58px;padding:6px 2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
.plans{display:grid;gap:10px}
.plan-opt{text-align:left;border-radius:var(--r);padding:14px 16px;display:block;min-height:0;width:100%;background:var(--surface)}
.plan-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plan-opt strong{display:block;font-family:var(--display);font-size:1.15rem}
.plan-opt span{font-weight:400;color:var(--muted);font-size:.9rem}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:0}
@media (prefers-reduced-motion:no-preference){ .fade{animation:fade .25s ease-out} @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>

</head>

</div></nav>

/* ---------- plans ---------- */
function chapterList(fromIdx, toIdx){ const out=[]; for(let b=fromIdx;b<=toIdx;b++) for(let c=1;c<=BOOKS[b][1];c++) out.push([BOOKS[b][0],c]); return out; }
function formatChunk(chs){
  const groups=[]; for(const [b,c] of chs){ const g=groups[groups.length-1]; if(g&&g.b===b&&g.e===c-1) g.e=c; else groups.push({b,s:c,e:c}); }
  return groups.map(g=> ONE_CH.has(g.b)?g.b : `${g.b} ${g.s===g.e?g.s:g.s+"-"+g.e}`).join("; ");
}
function spread(chs, days){ const out=[]; for(let d=0;d<days;d++){ const a=Math.floor(d*chs.length/days), z=Math.floor((d+1)*chs.length/days); out.push(formatChunk(chs.slice(a,z))); } return out; }
function perDay(chs, n){ const out=[]; for(let i=0;i<chs.length;i+=n) out.push(formatChunk(chs.slice(i,i+n))); return out; }
const planCache={};
function getPlan(p){
  const key = p.planId==="book" ? `book:${p.bookFrom}:${p.bookTo}:${p.perDay}` : p.planId;
  if(planCache[key]) return planCache[key];
  let days, name;
  if(p.planId==="tbr"){ days=TBR; name="The Bible Recap"; }
  else if(p.planId==="year"){ days=spread(chapterList(0,65),365); name="Bible in a Year"; }
  else if(p.planId==="nt"){ days=perDay(chapterList(39,65),1); name="New Testament"; }
  else { const a=+p.bookFrom||0, z=Math.max(a,+p.bookTo||a); days=perDay(chapterList(a,z), Math.max(1,+p.perDay||1)); name = a===z?BOOKS[a][0]:`${BOOKS[a][0]} to ${BOOKS[z][0]}`; }
  return planCache[key]={days,name,key};
}
function countChapters(ref){
  let n=0;
  for(const seg of ref.split(";")){
    const m=seg.trim().match(/^(\d?\s?[A-Za-z][A-Za-z ]*?)(?:\s+(\d.*))?$/); if(!m) continue;
    if(!m[2]){ n+=1; continue; }
    for(const it of m[2].split(",")){
      const [a,b]=it.trim().split("-");
      if(!b){ n+=1; continue; }
      const ca=parseInt(a), aHasV=a.includes(":"), bHasC=b.includes(":");
      if(aHasV && !bHasC) n+=1; else n+= (parseInt(b)-ca+1)||1;
    }
  }
  return n;
}
function gatewayURL(ref){
  const parts=[];
  for(const seg of ref.split(";")){ const s=seg.trim(); const m=s.match(/^(\d?\s?[A-Za-z][A-Za-z ]*?)(?:\s+(\d.*))?$/);
    if(!m||!m[2]) { parts.push(s); continue; }
    const book=m[1].trim().replace(/^Psalms$/,"Psalm"); for(const it of m[2].split(",")) parts.push(`${book} ${it.trim()}`); }
  return "https://www.biblegateway.com/passage/?search="+encodeURIComponent(parts.join("; "))+"&version=NIV";
}

  if(!FB_ON){ S.mode="local"; loadLocal(); render(); return; }
  fbAuth.getRedirectResult().catch(e=>toast(authMsg(e)));
  fbAuth.onAuthStateChanged(async u=>{
    S.unsubs.forEach(f=>f()); S.unsubs=[]; S.partners=[]; S.cheers=[];
    if(!u){
      S.uid=null; S.canShare=false;

      render(); return;
    }
    S.mode="loading"; render();
    S.uid=u.uid; S.email=u.email||""; S.canShare=true;
    try{
      const snap=await base().get();
      S.profile=snap.exists?snap.data():null; S.entries={}; S.verses={}; S.prayers={};
      for(const kind of ["entries","verses","prayers"]){ const q=await base().collection(kind).get(); q.forEach(d=>S[kind][d.id]=d.data()); }
      const local=lsGet(LKEY,null);
      if(!S.profile && local && local.profile){ // move device-only data into the new account
        Object.assign(S,{profile:local.profile,entries:local.entries||{},verses:local.verses||{},prayers:local.prayers||{}});
        S.mode="cloud"; await saveProfile();
        for(const k of ["entries","verses","prayers"]) for(const i in S[k]) await putItem(k,i);
        toast("Moved your study from this device into your account");
      }
      S.mode="cloud";
      try{ localStorage.removeItem(LOCALONLY); }catch(e){}
      if(S.profile){ await ensureCode(); listenShared(); }
    }catch(e){ console.warn(e); toast("Couldn't load your account. Check your connection."); S.mode="cloud"; }
    render();
  });
}
function authMsg(e){ const c=(e&&e.code)||""; if(c.includes("unauthorized-domain")) return "This website isn't approved in Firebase yet. Add it under Authentication → Settings → Authorized domains."; if(c.includes("popup-closed")||c.includes("cancelled")) return "Sign-in cancelled"; return "Sign-in didn't work. Try again."; }

/* ---------- accountability: friend codes ---------- */
const CODE_CHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
async function ensureCode(){
  if(S.profile.code) return;
  for(let tries=0;tries<6;tries++){
    let c=""; for(let i=0;i<6;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
    try{ const ref=fbDb.collection("codes").doc(c); if((await ref.get()).exists) continue; await ref.set({uid:S.uid}); S.profile.code=c; await saveProfile(); return; }catch(e){ console.warn(e); }
  }
}
function listenShared(){
  const friends=S.profile.friends||[];
  S.partners=[];
  friends.forEach(fid=>{
    S.unsubs.push(fbDb.collection("progress").doc(fid).onSnapshot(d=>{
      S.partners=S.partners.filter(x=>x.id!==fid);
      S.partners.push(d.exists?{id:fid,...d.data()}:{id:fid,hidden:true});
      if(S.tab==="progress") render();
    },()=>{}));
  });
  S.unsubs.push(fbDb.collection("cheers").where("to","==",S.uid).onSnapshot(q=>{
    S.cheers=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at.localeCompare(a.at));
    if(S.tab==="progress"||S.tab==="tonight") render();
  },()=>{}));
}
function relisten(){ S.unsubs.forEach(f=>f()); S.unsubs=[]; listenShared(); }
async function addFriend(code){
  code=code.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==6) return toast("Friend codes are 6 characters");
  if(code===S.profile.code) return toast("That's your own code");
  try{
    const d=await fbDb.collection("codes").doc(code).get();
    if(!d.exists) return toast("No one has that code. Check it and try again.");
    const fid=d.data().uid; const fr=S.profile.friends||[];
    if(fr.includes(fid)) return toast("Already on your list");
    S.profile.friends=[...fr,fid]; await saveProfile(); relisten(); toast("Friend added. Ask them to add your code too."); render();
  }catch(e){ toast("Couldn't add that friend. Try again."); }
}
async function removeFriend(fid){ S.profile.friends=(S.profile.friends||[]).filter(x=>x!==fid); await saveProfile(); relisten(); render(); }

  if(S.mode!=="cloud"||!S.profile) return;

/* ---------- derived state ---------- */
function stats(){
  const p=S.profile, plan=getPlan(p), total=plan.days.length, done=doneMap(p);
  const doneDays=Object.keys(done).map(Number).filter(d=>d>=1&&d<=total);
  const nd=nextUnread(plan.days,done), next=nd?{day:nd,ref:plan.days[nd-1]}:null;
  const dates=new Set(Object.values(done).filter(v=>/^\d{4}-/.test(v))); const t=today();
  let streak=0, cur=dates.has(t)?t:addDays(t,-1); while(dates.has(cur)){ streak++; cur=addDays(cur,-1); }
  const lastStudied=[...dates].sort().pop()||null;
  const completedCount=doneDays.length;
  const remaining=total-completedCount;
  const doneTonight=dates.has(t);
  const finish = remaining<=0? null : addDays(t, doneTonight? remaining : remaining-1);
  const chapters=doneDays.reduce((n,d)=>n+countChapters(plan.days[d-1]||""),0);
  const entries=Object.values(S.entries);
  return { planName:plan.name, total, next, streak, lastStudied, daysStudied:dates.size, chapters, remaining, finish, doneTonight,
    pct:Math.round(completedCount/total*100), verses:Object.keys(S.verses).length,
    prayersActive:Object.values(S.prayers).filter(x=>!x.answered).length, prayersAnswered:Object.values(S.prayers).filter(x=>x.answered).length,
    actionsDone:entries.filter(e=>e.followUp==="did").length, actionsAsked:entries.filter(e=>e.followUp).length };
}

    <input type="search" id="jq" placeholder="Search your reflections" value="${esc(jFilter.q)}">
    <div class="chips"><button class="chip" data-jt="" aria-pressed="${!jFilter.tag}">All</button>${TOPICS.filter(t=>used.has(t)).map(t=>`<button class="chip" data-jt="${t}" aria-pressed="${jFilter.tag===t}">${t}</button>`).join("")}</div>
    ${list.length?`<div class="list">${list.map(e=>`<article class="item"><div class="spread"><b>${esc(e.ref)}</b><span class="small muted">${e.completedOn?fmtDate(e.completedOn):"In progress"}</span></div>
      ${(e.tags||[]).length?`<div class="chips">${e.tags.map(t=>`<span class="pill">${t}</span>`).join("")}</div>`:""}
      ${qa("Stood out",e.stands)}${qa("About God",e.god)}${qa("Asking me to change",e.change)}${qa("Key verse",e.keyVerse)}${qa("Prayer",e.pray)}
      ${e.action?`<p class="entry-q">Action</p><div class="spread"><p class="entry-a" style="flex:1;min-width:0">${esc(e.action)}</p>${e.followUp?`<span class="pill ${fu[e.followUp][0]}">${fu[e.followUp][1]}</span>`:""}</div>`:""}
    </article>`).join("")}</div>`
    :`<div class="quiet"><p><b>${jFilter.tag||jFilter.q?"Nothing matches yet.":"Your reflections will collect here."}</b></p><p class="small muted">Each night's answers, key verse and action are saved to this journal so you can look back on what you've learned.</p></div>`}
  </div>`;
}
function bindJournal(){
  document.querySelectorAll("[data-jt]").forEach(b=>b.onclick=()=>{ jFilter.tag=b.dataset.jt; render(); });
  const q=$("#jq"); q.oninput=()=>{ jFilter.q=q.value; debounce("jq",()=>{ render(); const n=$("#jq"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },350); };
}

/* ---------- memory verses ---------- */
const INTERVALS=[1,2,4,7,14,30];
let vState={reveal:false,hint:false,adding:false};
function dueVerses(){ const t=today(); return Object.values(S.verses).filter(v=>(v.next||t)<=t).sort((a,b)=>(a.next||"").localeCompare(b.next||"")); }
function firstLetters(s){ return s.replace(/([A-Za-z])[A-Za-z'’]*/g,"$1"); }
function viewVerses(){
  const due=dueVerses(), v=due[0], all=Object.values(S.verses).sort((a,b)=>(a.next||"").localeCompare(b.next||""));
  const levels=["New","Learning","Learning","Familiar","Familiar","Known","Known"];
  return `<div class="stack-lg"><div class="spread"><div class="stack" style="gap:4px"><p class="eyebrow">Memory verses</p><h2>Hide it in your heart</h2></div><button class="sm" id="addV">Add verse</button></div>
    <form id="vForm" class="card stack" ${vState.adding?"":"hidden"}>
      <div class="field"><label for="vRef">Reference</label><input id="vRef" type="text" required placeholder="e.g. Joshua 1:9"></div>
      <div class="field"><label for="vText">Verse text</label><textarea id="vText" required placeholder="Copy it from your NIV Bible"></textarea></div>
      <div class="row"><button class="primary sm" type="submit">Save verse</button><button class="sm" type="button" id="vCancel">Cancel</button></div></form>
    ${v?`<section class="hero stack"><div class="spread"><p class="eyebrow">Review · ${due.length} due today</p><span class="pill">${levels[v.box||0]}</span></div>
      <h2>${esc(v.ref)}</h2>
      <p class="verse-text ${vState.reveal||vState.hint?"":"hidden-text"}">${esc(vState.reveal?v.text:vState.hint?firstLetters(v.text):v.text)}</p>
      ${vState.reveal?`<p class="small muted">Did you say it correctly from memory?</p><div class="row"><button class="primary" data-grade="got">I got it</button><button data-grade="miss">I missed some</button></div>`
      :`<p class="small muted">Say it out loud from memory, then check yourself.</p><div class="row"><button class="primary" id="reveal">Show the verse</button>${vState.hint?"":`<button id="hint">First-letter hint</button>`}</div>`}</section>`
    :all.length?`<div class="banner good"><b>All caught up.</b> Your next review is ${fmtDate(all[0].next)}.</div>`:""}
    ${all.length?`<div class="list">${all.map(x=>`<div class="item"><div class="spread"><b>${esc(x.ref)}</b><span class="small muted">${(x.next||today())<=today()?"Due now":"Next "+fmtDate(x.next)}</span></div><p class="small muted">${esc(x.text.slice(0,110))}${x.text.length>110?"…":""}</p><div class="row"><button class="ghost sm" data-delv="${x.id}">Remove</button></div></div>`).join("")}</div>`
    :`<div class="quiet"><p><b>Start with one verse.</b></p><p class="small muted">Add a verse that struck you tonight. Review it here: each time you get it right, it comes back after a longer gap (1, 2, 4, 7, 14, then 30 days).</p></div>`}
  </div>`;
}
function bindVerses(){
  $("#addV").onclick=()=>{ vState.adding=true; render(); $("#vRef").focus(); };
  $("#vCancel").onclick=()=>{ vState.adding=false; render(); };
  $("#vForm").onsubmit=async e=>{ e.preventDefault(); const ref=$("#vRef").value.trim(), text=$("#vText").value.trim(); if(!ref||!text) return;
    const id=uid8(); S.verses[id]={id,ref,text,box:0,next:today(),added:today()}; vState.adding=false; await putItem("verses",id); publishProgress(); toast("Verse added"); render(); };
  const rv=$("#reveal"); if(rv) rv.onclick=()=>{ vState.reveal=true; render(); };
  const hn=$("#hint"); if(hn) hn.onclick=()=>{ vState.hint=true; render(); };
  document.querySelectorAll("[data-grade]").forEach(b=>b.onclick=async()=>{ const v=dueVerses()[0]; if(!v) return;
    if(b.dataset.grade==="got"){ v.box=Math.min((v.box||0)+1,INTERVALS.length); v.next=addDays(today(),INTERVALS[v.box-1]); } else { v.box=0; v.next=addDays(today(),1); }
    vState={reveal:false,hint:false,adding:false}; await putItem("verses",v.id); render(); });
  document.querySelectorAll("[data-delv]").forEach(b=>b.onclick=async()=>{ const id=b.dataset.delv; if(b.dataset.armed){ delete S.verses[id]; await putItem("verses",id); publishProgress(); render(); } else { b.dataset.armed="1"; b.textContent="Tap again to remove"; } });
}

/* ---------- prayer ---------- */
let pView={tab:"active",adding:false,updating:null,answering:null};
function viewPrayer(){
  const all=Object.values(S.prayers), list=all.filter(x=>pView.tab==="active"?!x.answered:x.answered).sort((a,b)=>(b.answeredOn||b.addedOn).localeCompare(a.answeredOn||a.addedOn));
  return `<div class="stack-lg"><div class="spread"><div class="stack" style="gap:4px"><p class="eyebrow">Prayer</p><h2>Prayer list</h2></div><button class="sm" id="addP">Add request</button></div>
    <form id="pForm" class="card stack" ${pView.adding?"":"hidden"}>
      <div class="field"><label for="pTitle">Prayer request</label><input id="pTitle" type="text" required maxlength="140" placeholder="Who or what are you praying for?"></div>
      <div class="field"><label for="pDet">Details <span class="hint">(optional)</span></label><textarea id="pDet"></textarea></div>
      <div class="row"><button class="primary sm" type="submit">Save request</button><button class="sm" type="button" id="pCancel">Cancel</button></div></form>
    <div class="chips"><button class="chip" data-pt="active" aria-pressed="${pView.tab==="active"}">Praying (${all.filter(x=>!x.answered).length})</button><button class="chip" data-pt="answered" aria-pressed="${pView.tab==="answered"}">Answered (${all.filter(x=>x.answered).length})</button></div>
    ${list.length?`<div class="list">${list.map(x=>`<article class="item">
      <div class="spread"><b style="flex:1;min-width:0">${esc(x.title)}</b>${x.answered?'<span class="pill good">Answered</span>':`<span class="small muted">Since ${fmtDate(x.addedOn)}</span>`}</div>
      ${x.details&&x.details!==x.title?`<p class="entry-a small">${esc(x.details)}</p>`:""}
      ${x.ref?`<p class="small muted">From ${esc(x.ref)}</p>`:""}
      ${(x.updates||[]).map(u=>`<p class="small"><span class="muted">${fmtDate(u.on)}:</span> ${esc(u.text)}</p>`).join("")}
      ${x.answered?`<p class="small"><span class="muted">Answered ${fmtDate(x.answeredOn)}:</span> ${esc(x.answerNote||"")}</p>`:""}
      ${pView.updating===x.id?`<div class="row"><input type="text" id="upd" placeholder="What's changed?" style="flex:1;min-width:160px"><button class="sm primary" data-saveupd="${x.id}">Save</button></div>`:""}
      ${pView.answering===x.id?`<div class="row"><input type="text" id="ans" placeholder="How did God answer?" style="flex:1;min-width:160px"><button class="sm primary" data-saveans="${x.id}">Mark answered</button></div>`:""}
      ${!x.answered&&pView.updating!==x.id&&pView.answering!==x.id?`<div class="row"><button class="ghost sm" data-upd="${x.id}">Add update</button><button class="ghost sm" data-ans="${x.id}">Answered</button></div>`:""}
    </article>`).join("")}</div>`
    :`<div class="quiet"><p><b>${pView.tab==="active"?"No requests yet.":"No answered prayers yet."}</b></p><p class="small muted">${pView.tab==="active"?"Add what you're praying for, or tap \"Add to prayer list\" during tonight's study. Record updates as things change.":"When God answers a prayer, mark it answered and write down how. Looking back on these builds faith."}</p></div>`}
  </div>`;
}
function bindPrayer(){
  $("#addP").onclick=()=>{ pView.adding=true; render(); $("#pTitle").focus(); };
  $("#pCancel").onclick=()=>{ pView.adding=false; render(); };
  $("#pForm").onsubmit=async e=>{ e.preventDefault(); const title=$("#pTitle").value.trim(); if(!title) return; const id=uid8();
    S.prayers[id]={id,title,details:$("#pDet").value.trim(),addedOn:today(),updates:[],answered:false}; pView.adding=false; pView.tab="active"; await putItem("prayers",id); render(); };
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{ pView.tab=b.dataset.pt; render(); });
  document.querySelectorAll("[data-upd]").forEach(b=>b.onclick=()=>{ pView.updating=b.dataset.upd; pView.answering=null; render(); $("#upd").focus(); });
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ pView.answering=b.dataset.ans; pView.updating=null; render(); $("#ans").focus(); });
  document.querySelectorAll("[data-saveupd]").forEach(b=>b.onclick=async()=>{ const x=S.prayers[b.dataset.saveupd], t=$("#upd").value.trim(); if(t){ x.updates=[...(x.updates||[]),{on:today(),text:t}]; await putItem("prayers",x.id); } pView.updating=null; render(); });
  document.querySelectorAll("[data-saveans]").forEach(b=>b.onclick=async()=>{ const x=S.prayers[b.dataset.saveans]; x.answered=true; x.answeredOn=today(); x.answerNote=$("#ans").value.trim(); pView.answering=null; await putItem("prayers",x.id); toast("Praise God. Moved to answered."); render(); });
}
boot();
</script>
</body>
</html>
